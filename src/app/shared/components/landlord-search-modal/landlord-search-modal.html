<div class="modal fade" id="landlordSearchModal" tabindex="-1" aria-labelledby="landlordSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0">
      <div class="modal-header p-3 bg-primary-subtle">
        <h5 class="modal-title" id="landlordSearchModalLabel">
          <i class="ri-search-line me-2"></i> Buscar Locador
        </h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeAndReturn()"></button>
      </div>
      <div class="modal-body">
        <!-- Buscador -->
        <div class="search-box mb-3">
          <input
            type="text"
            class="form-control search bg-light border-light"
            placeholder="Buscar por nombre o número de documento..."
            [value]="searchTerm()"
            (input)="onSearch($any($event.target).value)"
          >
          <i class="ri-search-line search-icon"></i>
        </div>
        <!-- Tabla de locadores -->
        <div class="table-responsive" style="max-height: 350px; overflow-y: auto;">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light text-muted sticky-top">
              <tr>
                <th>Tipo Doc.</th>
                <th>N° Documento</th>
                <th>Nombre</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              @for (landlord of filteredLandlords(); track landlord.id) {
                <tr style="cursor: pointer;" (click)="selectLandlord(landlord)">
                  <td>
                    @if (landlord.type_document) {
                      <span class="badge bg-info-subtle text-info">{{ landlord.type_document.acronym }}</span>
                    } @else {
                      <span class="text-muted">—</span>
                    }
                  </td>
                  <td class="fw-medium">{{ landlord.document_number }}</td>
                  <td>{{ getLandlordName(landlord) }}</td>
                  <td>
                    <button type="button" class="btn btn-sm btn-primary" (click)="selectLandlord(landlord)">
                      Seleccionar
                    </button>
                  </td>
                </tr>
              } @empty {
                <tr>
                  <td colspan="4" class="text-center text-muted py-3">No se encontraron locadores.</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" (click)="closeAndReturn()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
