<header id="page-topbar">
  <div class="layout-width">
    <div class="navbar-header">

      <div class="d-flex">
        <!-- LOGO -->
        <div class="navbar-brand-box horizontal-logo">
          <a routerLink="/dashboard" class="logo logo-dark">
            <span class="logo-sm">
              <img src="assets/images/logo-sm.png" alt="" height="22">
            </span>
            <span class="logo-lg">
              <img src="assets/images/logo-dark.png" alt="" height="17">
            </span>
          </a>
          <a routerLink="/dashboard" class="logo logo-light">
            <span class="logo-sm">
              <img src="assets/images/logo-sm.png" alt="" height="22">
            </span>
            <span class="logo-lg">
              <img src="assets/images/logo-light.png" alt="" height="17">
            </span>
          </a>
        </div>

        <!-- Hamburger -->
        <button type="button"
          class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger"
          id="topnav-hamburger-icon"
          (click)="toggleSidebar()">
          <span class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>

      <div class="d-flex align-items-center">
        <!-- User dropdown -->
        <div class="dropdown ms-sm-3 header-item topbar-user">
          <button type="button" class="btn" id="page-header-user-dropdown"
            data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <span class="d-flex align-items-center">
              <img class="rounded-circle header-profile-user"
                src="assets/images/users/avatar-1.jpg" alt="Avatar">
              <span class="text-start ms-xl-2">
                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">
                  {{ currentUser()?.username || 'Usuario' }}
                </span>
                <span class="d-none d-xl-block ms-1 fs-12 user-name-sub-text">
                  {{ currentUser()?.roles?.[0] || '' }}
                </span>
              </span>
            </span>
          </button>
          <div class="dropdown-menu dropdown-menu-end">
            <h6 class="dropdown-header">Bienvenido, {{ currentUser()?.username || 'Usuario' }}</h6>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" routerLink="/profile">
              <i class="mdi mdi-account-circle text-muted fs-16 align-middle me-1"></i>
              <span class="align-middle">Mi Perfil</span>
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="javascript:void(0)" (click)="logout()">
              <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
              <span class="align-middle">Cerrar Sesión</span>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>
</header>
