<div class="modal fade" [class.show]="isOpen()" [style.display]="isOpen() ? 'block' : 'none'" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-bottom-0">
        <h5 class="modal-title fw-bold text-gray-800">
          {{ isEditMode() ? 'Editar Notificación' : 'Nueva Notificación' }}
        </h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form [formGroup]="notificationForm" (ngSubmit)="save()">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label fw-medium">Título <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="title" placeholder="Ej. ¡Nueva Actualización Disponible!">
            </div>
            
            <div class="col-md-12">
              <label class="form-label fw-medium">Mensaje <span class="text-danger">*</span></label>
              <textarea class="form-control" formControlName="message" rows="4" placeholder="Escribe el cuerpo de la notificación aquí..."></textarea>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">URL de Imagen</label>
              <input type="url" class="form-control" formControlName="image_url" placeholder="https://...">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">URL de Destino</label>
              <input type="url" class="form-control" formControlName="destination_url" placeholder="https://...">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Fecha de Inicio de Envío</label>
              <input type="datetime-local" class="form-control" formControlName="start_date">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Fecha de Expiración</label>
              <input type="datetime-local" class="form-control" formControlName="end_date">
            </div>

            <div class="col-12 mt-4">
              <div class="form-check form-switch fs-5">
                <input class="form-check-input cursor-pointer" type="checkbox" role="switch" id="activeNotificationSwitch" formControlName="is_active">
                <label class="form-check-label cursor-pointer fs-6 mt-1 ms-2" for="activeNotificationSwitch">Notificación Activa</label>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <button type="button" class="btn btn-light me-2 px-4" (click)="close()">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 shadow-sm" [disabled]="notificationForm.invalid || isSubmitting()">
              @if(isSubmitting()) {
                <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando...
              } @else {
                <i class="ri-save-line me-1"></i> {{ isEditMode() ? 'Actualizar' : 'Guardar' }}
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- Backdrop -->
@if (isOpen()) {
  <div class="modal-backdrop fade show"></div>
}
