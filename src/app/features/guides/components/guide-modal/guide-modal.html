<div class="modal fade" [class.show]="isOpen()" [style.display]="isOpen() ? 'block' : 'none'" [style.z-index]="zIndex()" tabindex="-1" role="dialog" [attr.aria-hidden]="!isOpen() ? 'true' : null">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-bottom-0">
        <h5 class="modal-title fw-bold text-gray-800">
          {{ isEditMode() ? 'Editar Guía de Remisión' : 'Nueva Guía de Remisión' }}
        </h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form [formGroup]="guideForm" (ngSubmit)="save()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-medium">Número de Guía <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [class.is-invalid]="backendError()" formControlName="guide_number" placeholder="Ej. GUI-2024-001" (input)="backendError.set(null)">
              @if (backendError()) {
                <div class="invalid-feedback">{{ backendError() }}</div>
              }
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Fecha de Emisión</label>
              <input type="date" class="form-control" formControlName="issue_date">
            </div>

            <div class="col-md-12">
              <label class="form-label fw-medium">Archivo Adjunto</label>
              <input type="file" class="form-control" (change)="onFileChange($event)">
              @if (fileError()) {
                <small class="text-danger d-block mt-1">{{ fileError() }}</small>
              }
              @if (isEditMode() && guide()?.attached_file) {
                <small class="text-muted d-block mt-1">Ya hay un archivo adjunto. Sube uno nuevo para reemplazarlo.</small>
              }
            </div>

            <div class="col-12 mt-4">
              <div class="form-check form-switch">
                <input class="form-check-input cursor-pointer" type="checkbox" role="switch" id="activeGuideSwitch" formControlName="is_active">
                <label class="form-check-label cursor-pointer" for="activeGuideSwitch">Guía Activa</label>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <button type="button" class="btn btn-light me-2 px-4" (click)="close()">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 shadow-sm" [disabled]="guideForm.invalid || isSubmitting()">
              @if(isSubmitting()) {
                <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando...
              } @else {
                <i class="ri-save-line me-1"></i> {{ isEditMode() ? 'Actualizar' : 'Guardar' }}
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- Backdrop -->
@if (isOpen()) {
  <div class="modal-backdrop fade show" [style.z-index]="zIndex() - 5"></div>
}
