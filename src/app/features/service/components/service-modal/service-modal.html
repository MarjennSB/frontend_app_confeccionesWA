<div class="modal fade" [class.show]="isOpen()" [style.display]="isOpen() ? 'block' : 'none'" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-bottom-0">
        <h5 class="modal-title fw-bold text-gray-800">
          {{ isEditMode() ? 'Editar Servicio' : 'Nuevo Servicio' }}
        </h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form [formGroup]="serviceForm" (ngSubmit)="save()">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-medium">Título <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="title" placeholder="Ej. Pago de arbitrios">
            </div>
            
            <div class="col-md-4">
              <label class="form-label fw-medium">Tipo de Servicio <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="service_type_id">
                <option [ngValue]="null" disabled>Seleccione un tipo</option>
                @for (type of serviceTypes(); track type.id) {
                  <option [value]="type.id">{{ type.name }}</option>
                }
              </select>
            </div>

            <div class="col-md-12">
              <label class="form-label fw-medium">Subtítulo</label>
              <input type="text" class="form-control" formControlName="subtitle" placeholder="Breve descripción">
            </div>

            <div class="col-md-12">
              <label class="form-label fw-medium">Descripción</label>
              <textarea class="form-control" formControlName="description" rows="3" placeholder="Descripción detallada"></textarea>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">URL de Destino</label>
              <input type="url" class="form-control" formControlName="destination_url" placeholder="https://...">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">URL de Imagen/Icono</label>
              <input type="url" class="form-control" formControlName="image_url" placeholder="https://...">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Orden de Visualización</label>
              <input type="number" class="form-control" formControlName="display_order">
            </div>

            <div class="col-md-6 d-flex align-items-end">
              <div class="form-check form-switch fs-5 mb-1">
                <input class="form-check-input" type="checkbox" role="switch" id="isActiveSwitch" formControlName="is_active">
                <label class="form-check-label fs-6 mt-1 ms-2" for="isActiveSwitch">Activo</label>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <button type="button" class="btn btn-light me-2 px-4" (click)="close()">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 shadow-sm" [disabled]="serviceForm.invalid || isSubmitting()">
              @if(isSubmitting()) {
                <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando...
              } @else {
                <i class="ri-save-line me-1"></i> {{ isEditMode() ? 'Actualizar' : 'Guardar' }}
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- Backdrop -->
@if (isOpen()) {
  <div class="modal-backdrop fade show"></div>
}
