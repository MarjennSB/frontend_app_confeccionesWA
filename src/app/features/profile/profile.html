    <!-- Cambio de contraseña -->
    <div class="col-12">
      <div class="card">
        <div class="card-header border-0">
          <h5 class="card-title mb-0">
            <i class="ri-lock-password-line me-2"></i>Cambiar Contraseña
          </h5>
        </div>
        <div class="card-body">

          @if (successMsg()) {
            <div class="alert alert-success alert-dismissible" role="alert">
              <i class="ri-checkbox-circle-line me-2"></i>{{ successMsg() }}
              <button type="button" class="btn-close" (click)="successMsg.set(null)"></button>
            </div>
          }

          @if (errorMsg()) {
            <div class="alert alert-danger alert-dismissible" role="alert">
              <i class="ri-error-warning-line me-2"></i>{{ errorMsg() }}
              <button type="button" class="btn-close" (click)="errorMsg.set(null)"></button>
            </div>
          }

          <form (ngSubmit)="onChangePassword()" #pwForm="ngForm">
            <div class="row g-3">
              <div class="col-lg-4 col-12">
                <label class="form-label">Contraseña actual <span class="text-danger">*</span></label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Ingrese su contraseña actual"
                  [value]="currentPassword()"
                  (input)="currentPassword.set($any($event.target).value)"
                  required
                >
              </div>
              <div class="col-lg-4 col-12">
                <label class="form-label">Nueva contraseña <span class="text-danger">*</span></label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Mínimo 6 caracteres"
                  [value]="newPassword()"
                  (input)="newPassword.set($any($event.target).value)"
                  required
                >
              </div>
              <div class="col-lg-4 col-12">
                <label class="form-label">Confirmar nueva contraseña <span class="text-danger">*</span></label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Repita la nueva contraseña"
                  [value]="confirmPassword()"
                  (input)="confirmPassword.set($any($event.target).value)"
                  required
                >
              </div>
              <div class="col-12">
                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="isChangingPassword() || !currentPassword() || !newPassword() || !confirmPassword()"
                >
                  @if (isChangingPassword()) {
                    <span class="spinner-border spinner-border-sm me-1" role="status"></span>
                    Guardando...
                  } @else {
                    <i class="ri-save-line me-1"></i> Cambiar contraseña
                  }
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>
