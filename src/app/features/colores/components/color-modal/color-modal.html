<div class="modal fade" [class.show]="isOpen()" [style.display]="isOpen() ? 'block' : 'none'" [style.z-index]="zIndex()" tabindex="-1" role="dialog" [attr.aria-hidden]="!isOpen() ? 'true' : null">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-bottom-0">
        <h5 class="modal-title fw-bold text-gray-800">
          {{ isEditMode() ? 'Editar Color' : 'Nuevo Color' }}
        </h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form [formGroup]="colorForm" (ngSubmit)="save()">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label fw-medium">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="name" placeholder="Ej. Rojo">
            </div>
            
            <div class="col-md-12">
              <label class="form-label fw-medium">Abreviatura <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="abbreviation" placeholder="Ej. ROJ">
            </div>

            <div class="col-12 mt-4">
              <div class="form-check form-switch">
                <input class="form-check-input cursor-pointer" type="checkbox" role="switch" id="activeColorSwitch" formControlName="is_active">
                <label class="form-check-label cursor-pointer" for="activeColorSwitch">Color Activo</label>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <button type="button" class="btn btn-light me-2 px-4" (click)="close()">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 shadow-sm" [disabled]="colorForm.invalid || isSubmitting()">
              @if(isSubmitting()) {
                <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando...
              } @else {
                <i class="ri-save-line me-1"></i> {{ isEditMode() ? 'Actualizar' : 'Guardar' }}
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- Backdrop -->
@if (isOpen()) {
  <div class="modal-backdrop fade show" [style.z-index]="zIndex() - 5"></div>
}
