<div class="container-fluid py-4">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
    <h2 class="h4 mb-0 text-gray-800">Gestión de Roles</h2>
    <button class="btn btn-primary shadow-sm align-self-start align-self-sm-auto" (click)="openModal()">
      <i class="ri-add-line me-1"></i> Nuevo Rol
    </button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4">ID</th>
              <th>Nombre del Rol</th>
              <th>Permisos</th>
              <th class="text-end pe-4 text-nowrap">Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (role of roles(); track role.id) {
            <tr>
              <td class="ps-4 text-muted small">{{ role.id }}</td>
              <td class="fw-bold text-dark">
                <span class="badge bg-dark px-2 py-1 shadow-sm rounded-1">
                  {{ role.name }}
                </span>
              </td>
              <td>
                <span class="badge bg-secondary px-2 py-1 shadow-sm rounded-1">
                  <i class="ri-shield-keyhole-line me-1"></i> {{ role.permision?.length || 0 }} permisos
                </span>
              </td>
              <td class="text-end pe-4 text-nowrap">
                <button class="btn btn-sm btn-outline-dark shadow-sm me-2 px-2 py-1" (click)="openModal(role)" title="Editar">
                  <i class="ri-pencil-line"></i> Editar
                </button>
              </td>
            </tr>
            } @empty {
            <tr>
              <td colspan="4" class="text-center py-4 text-muted">
                No hay roles registrados en el sistema.
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

@if (isModalOpen()) {
<app-role-modal [isOpen]="isModalOpen()" [role]="selectedRole()" (closeModal)="closeModal()" (roleSaved)="loadRoles()">
</app-role-modal>
}
